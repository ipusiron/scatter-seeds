<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'; connect-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Scatter Seeds splits a secret into printable Shamir shares and restores it from a threshold set.">
  <title>Scatter Seeds</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script src="sha256-core.js" defer></script>
  <script src="sss-core.js" defer></script>
  <script src="bip39-english.js" defer></script>
  <script src="bip39.js" defer></script>
  <script src="vendor/qrcode.min.js" defer></script>
  <script src="vendor/jsQR.js" defer></script>
  <script src="qr.js" defer></script>
  <script src="messages.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="page-header">
    <p class="eyebrow">DAY124 · SPLIT / RESTORE / STORE</p>
    <div class="masthead">
      <h1>Scatter <span>Seeds</span></h1>
      <div class="header-tools">
        <button id="theme" class="icon-button" type="button" data-label="theme">◐</button>
        <button id="language" class="icon-button" type="button" data-label="language">EN</button>
        <button id="help" class="icon-button" type="button" data-label="help" aria-haspopup="dialog">?</button>
      </div>
    </div>
    <p class="subtitle" data-i18n="subtitle"></p>
    <p class="privacy" data-i18n="privacy"></p>
  </header>
  <main>
    <div class="tabs" role="tablist" data-label="tablist">
      <button id="tab-split" role="tab" type="button" aria-controls="panel-split" aria-selected="true" data-i18n="splitTab"></button>
      <button id="tab-restore" role="tab" type="button" aria-controls="panel-restore" aria-selected="false" data-i18n="restoreTab"></button>
      <button id="tab-guide" role="tab" type="button" aria-controls="panel-guide" aria-selected="false" data-i18n="guideTab"></button>
    </div>
    <section id="panel-split" class="panel" role="tabpanel" aria-labelledby="tab-split">
      <h2 data-i18n="splitTitle"></h2>
      <p data-i18n="splitIntro"></p>
    </section>
    <section id="panel-restore" class="panel" role="tabpanel" aria-labelledby="tab-restore" hidden>
      <h2 data-i18n="restoreTitle"></h2>
      <p data-i18n="restoreIntro"></p>
    </section>
    <section id="panel-guide" class="panel" role="tabpanel" aria-labelledby="tab-guide" hidden>
      <h2 data-i18n="guideTitle"></h2>
      <p data-i18n="guideIntro"></p>
    </section>
  </main>
  <footer><span>Scatter Seeds · MIT · Day124</span><a href="https://github.com/ipusiron/scatter-seeds">GitHub</a></footer>
  <dialog id="help-dialog" aria-labelledby="help-title">
    <h2 id="help-title" data-i18n="helpTitle"></h2>
    <p data-i18n="helpBody"></p>
    <button id="help-close" type="button" data-i18n="close"></button>
  </dialog>
</body>
</html>
